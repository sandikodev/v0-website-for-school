# ============================================
# AkseSekolah.id - Quick Start
# ============================================
#
# This is a convenience file that points to the appropriate
# docker-compose file based on your needs.
#
# For development:
#   docker compose -f docker/dev/docker-compose.dev.yml up
#
# For production:
#   docker compose -f docker/prod/docker-compose.prod.yml up -d
#
# Or use this file for production (default):
#   docker compose up -d

services:
  aksesekolah:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
    image: clients-aksesekolah:latest
    container_name: clients-aksesekolah-app
    restart: unless-stopped
    
    environment:
      # Core
      - NODE_ENV=production
      - PORT=3000
      # Database
      - DATABASE_URL=${DATABASE_URL}
      # Authentication
      - JWT_SECRET=${JWT_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=https://${DOMAIN:-aksesekolah.id}
      # Platform
      - NEXT_PUBLIC_PLATFORM_DOMAIN=${DOMAIN:-aksesekolah.id}
      - NEXT_PUBLIC_DASHBOARD_URL=https://dashboard.${DOMAIN:-aksesekolah.id}
    
    volumes:
      - ./data:/app/data
      - ./prisma:/app/prisma
      - ./public/uploads:/app/public/uploads
    
    networks:
      - nginx-net
    
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  nginx-net:
    external: true
