# ============================================
# AkseSekolah.id - Development Environment
# ============================================
#
# Usage: 
#   docker compose -f docker/dev/docker-compose.dev.yml up
#   docker compose -f docker/dev/docker-compose.dev.yml up -d (detached)
#   docker compose -f docker/dev/docker-compose.dev.yml down
#
# Features:
# - Hot reload enabled (pnpm dev)
# - Source code mounted for live changes
# - Debug mode
# - Development database (PostgreSQL)
# - Redis for caching
# - PgAdmin for database management

services:
  aksesekolah-dev:
    build:
      context: ../../
      dockerfile: docker/dev/Dockerfile.dev
    image: clients-aksesekolah:dev
    container_name: clients-aksesekolah-app-dev
    restart: unless-stopped
    
    environment:
      # Core
      - NODE_ENV=development
      - PORT=3000
      # Database (internal connection - always port 5432 inside container)
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@aksesekolah-db-dev:5432/aksesekolah_dev}
      # Authentication
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-dev-secret-key-change-in-production}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-in-production}
      - NEXTAUTH_URL=http://aksesekolah.local:3000
      # Platform
      - NEXT_PUBLIC_PLATFORM_DOMAIN=aksesekolah.local
      - NEXT_PUBLIC_DASHBOARD_URL=http://dashboard.aksesekolah.local:3000
    
    ports:
      - "3000:3000"  # Next.js dev server
    
    volumes:
      # Mount source code for hot reload
      - ../../app:/app/app
      - ../../components:/app/components
      - ../../lib:/app/lib
      - ../../public:/app/public
      - ../../styles:/app/styles
      - ../../hooks:/app/hooks
      - ../../types:/app/types
      - ../../config:/app/config
      - ../../middleware.ts:/app/middleware.ts
      - ../../next.config.mjs:/app/next.config.mjs
      - ../../tailwind.config.js:/app/tailwind.config.js
      - ../../tsconfig.json:/app/tsconfig.json
      - ../../.env.local:/app/.env.local
      # Data persistence
      - ../../prisma:/app/prisma
      - ../../public/uploads:/app/public/uploads
      # Use named volume for node_modules (preserve container's version)
      - node_modules:/app/node_modules
      - nextjs_cache:/app/.next
    
    networks:
      - dev-network
    
    depends_on:
      - aksesekolah-db-dev
      - aksesekolah-redis-dev

  aksesekolah-db-dev:
    image: postgres:16-alpine
    container_name: clients-aksesekolah-db-dev
    restart: unless-stopped
    
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=aksesekolah_dev
    
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    
    networks:
      - dev-network
    
    ports:
      - "${POSTGRES_PORT:-5433}:5432"  # Use 5433 by default to avoid conflicts
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aksesekolah_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  aksesekolah-redis-dev:
    image: redis:7-alpine
    container_name: clients-aksesekolah-redis-dev
    restart: unless-stopped
    
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    
    volumes:
      - dev-redis-data:/data
    
    networks:
      - dev-network
    
    ports:
      - "${REDIS_PORT:-6380}:6379"  # Use 6380 by default to avoid conflicts
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin-dev:
    image: dpage/pgadmin4:latest
    container_name: clients-aksesekolah-pgadmin-dev
    restart: unless-stopped
    
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@localhost.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
    
    volumes:
      - dev-pgadmin-data:/var/lib/pgadmin
    
    networks:
      - dev-network
    
    ports:
      - "${PGADMIN_PORT:-8081}:80"  # Use 8081 by default to avoid conflicts
    
    depends_on:
      - aksesekolah-db-dev

volumes:
  dev-db-data:
    driver: local
  dev-redis-data:
    driver: local
  dev-pgadmin-data:
    driver: local
  node_modules:
    driver: local
  nextjs_cache:
    driver: local

networks:
  dev-network:
    driver: bridge
