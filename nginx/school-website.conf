# ===============================
#  HTTP (Port 80) - Redirect to HTTPS
# ===============================
server {
    listen 80;
    server_name aksesekolah.id *.aksesekolah.id;

    # Allow Certbot challenge for SSL certificate
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ===============================
#  HTTPS (Port 443) - Main Application
# ===============================
server {
    listen 443 ssl http2;
    server_name aksesekolah.id *.aksesekolah.id;

    # SSL Certificate (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/aksesekolah.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aksesekolah.id/privkey.pem;
    
    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Client settings
    client_max_body_size 100M;
    client_body_timeout 600s;

    # Proxy timeouts
    proxy_connect_timeout 600s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Next.js specific - Allow hot reload in development
    location ~ ^/_next/webpack-hmr {
        proxy_pass http://school-website-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Next.js static files
    location /_next/static/ {
        proxy_pass http://school-website-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # Cache static files
        proxy_cache_valid 200 60m;
        proxy_cache_bypass $http_cache_control;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Public files (images, uploads, etc.)
    location /uploads/ {
        proxy_pass http://school-website-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # Cache uploads
        proxy_cache_valid 200 24h;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # API routes
    location /api/ {
        proxy_pass http://school-website-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        
        # Pass tenant info from custom domain
        proxy_set_header X-Tenant-Domain $host;
    }

    # Main application
    location / {
        proxy_pass http://school-website-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        
        # Pass tenant info from custom domain
        proxy_set_header X-Tenant-Domain $host;
    }

    # Block hidden files (except .well-known for SSL)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Health check endpoint (no auth required)
    location = /api/health {
        proxy_pass http://school-website-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
