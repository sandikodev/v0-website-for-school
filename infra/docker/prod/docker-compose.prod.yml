# ============================================
# AkseSekolah.id - Production Environment
# ============================================
#
# Usage:
#   docker compose -f docker/prod/docker-compose.prod.yml up -d
#   docker compose -f docker/prod/docker-compose.prod.yml down
#   docker compose -f docker/prod/docker-compose.prod.yml logs -f
#
# Features:
# - Production build (pnpm build)
# - Optimized image
# - Health checks
# - Resource limits
# - Auto-restart
# - External nginx network

services:
  aksesekolah-prod:
    build:
      context: ../../
      dockerfile: docker/Dockerfile
      target: runner
    image: clients-aksesekolah:latest
    container_name: clients-aksesekolah-app-prod
    restart: unless-stopped
    
    environment:
      # Core
      - NODE_ENV=production
      - PORT=3000
      # Database
      - DATABASE_URL=${DATABASE_URL}
      # Authentication
      - JWT_SECRET=${JWT_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=https://${DOMAIN:-aksesekolah.id}
      # Platform
      - NEXT_PUBLIC_PLATFORM_DOMAIN=${DOMAIN:-aksesekolah.id}
      - NEXT_PUBLIC_DASHBOARD_URL=https://dashboard.${DOMAIN:-aksesekolah.id}
    
    volumes:
      # Data persistence
      - ../../data:/app/data
      - ../../prisma:/app/prisma
      - ../../public/uploads:/app/public/uploads
      # Logs
      - ../../logs:/app/logs
    
    networks:
      - nginx-net
    
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    
    labels:
      - "com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy=true"

networks:
  nginx-net:
    external: true
